<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora | Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-page">

    <div class="auth-box">

        <a href="index.html" class="logo">NEXORA</a>

        <h1>Create account.</h1>
        <p>Start your Nexora journey.</p>

        <form onsubmit="registerUser(event)">

            <label>Name</label>
            <input
                type="text"
                id="registerName"
                placeholder="Your name"
                required
            >

            <label>Email</label>
            <input
                type="email"
                id="registerEmail"
                placeholder="you@example.com"
                required
            >

            <label>Password</label>
            <input
                type="password"
                id="registerPassword"
                placeholder="Create a password"
                required
            >

            <button class="primary-btn full-btn">
                Create account
            </button>

        </form>

        <p class="auth-bottom">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </div>

</div>

<script src="main.js"></script>
</body>
</html>
