<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-page">

    <div class="auth-box">

        <a href="index.html" class="logo">NEXORA</a>

        <h1>Welcome back.</h1>
        <p>Login to continue shopping.</p>

        <form onsubmit="loginUser(event)">

            <label>Email</label>
            <input
                type="email"
                id="loginEmail"
                placeholder="you@example.com"
                required
            >

            <label>Password</label>
            <input
                type="password"
                id="loginPassword"
                placeholder="••••••••"
                required
            >

            <button class="primary-btn full-btn">
                Login
            </button>

        </form>

        <p class="auth-bottom">
            Don't have an account?
            <a href="register.html">Create one</a>
        </p>

    </div>

</div>

<script src="main.js"></script>
</body>
</html>
